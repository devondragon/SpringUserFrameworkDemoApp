plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id "com.github.ben-manes.versions" version "0.61.0"

}

group = 'com.digitalsanctuary.springuser.demo'
version = '1.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Force the patched PostgreSQL JDBC driver ahead of the Spring Boot 4.1.1 BOM (which still manages
// 42.7.11). 42.7.12 fixes GHSA-j92g-9f8w-j867 (silent channel-binding auth downgrade). The demo defaults
// to MariaDB and never opens a Postgres connection, so this is supply-chain hygiene rather than an active
// fix; drop this override once a future Boot BOM manages 42.7.12+.
ext['postgresql.version'] = '42.7.12'

// Define the configurations used in the project
configurations {
    // Keep developmentOnly out of runtimeOnly, and so out of the boot jar. spring-boot-docker-compose
    // is declared developmentOnly precisely so a packaged jar never tries to start Docker Compose;
    // extending runtimeOnly from it put it back in the jar. bootRun adds it to the classpath below.
    developmentOnly
    testImplementation {
        extendsFrom runtimeOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
	dev
}

repositories {
    mavenLocal()
	mavenCentral()
}



dependencies {
    // DigitalSanctuary Spring User Framework
    // 5.3.4 aligns the passkey enrollment freshness denial to HTTP 401 + step-up-required (library #371),
    // which this demo's webauthn-register.js and step-up E2E exercise; 5.3.3 added the step-up primitive.
    implementation 'com.digitalsanctuary:ds-spring-user-framework:5.3.4'

    // WebAuthn support (Passkey authentication)
    implementation 'org.springframework.security:spring-security-webauthn'

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Thymeleaf extras - Spring Boot 4 manages the version
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // thymeleaf-layout-dialect 4.0.x is compiled against Groovy 5 and aligned with Spring
    // Boot 4, so the earlier GROOVY-11745 workaround (a Groovy exclude plus an explicit
    // Groovy 5.0.3 pin, needed only because 3.4.0 was a Groovy 4 build) is no longer required.
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:4.0.1'

    // OpenAPI (Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Runtime dependencies
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
    runtimeOnly 'org.postgresql:postgresql'

    // Docker Compose support for local development
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // Utility libraries
    // (passay is provided transitively by ds-spring-user-framework at the version it requires; the demo
    //  app does not use passay directly, so declaring/pinning it here previously forced a conflicting
    //  downgrade of the library's required passay version.)
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'org.hibernate.validator:hibernate-validator'

    // Compile-only dependencies
    compileOnly 'org.projectlombok:lombok'

    // Annotation processors
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2:2.4.240'

    // OAuth2 Testing dependencies
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

test {
	useJUnitPlatform {
    }
	  testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        // showStandardStreams = true         // Display log output

    }
}

bootRun {
	// Use Spring Boot DevTool only when we run Gradle bootRun task
	classpath = sourceSets.main.runtimeClasspath + configurations.developmentOnly
    sourceResources sourceSets.main
	if (project.hasProperty('profiles')) {
		environment SPRING_PROFILES_ACTIVE: profiles
	} else {
		def profiles = 'local'
		environment SPRING_PROFILES_ACTIVE: profiles
	}
}

// Playwright Test Integration
tasks.register('playwrightInstall', Exec) {
    description = 'Install Playwright dependencies'
    group = 'verification'
    workingDir 'playwright'
    commandLine 'npm', 'install'
}

tasks.register('playwrightBrowsers', Exec) {
    description = 'Install Playwright browsers'
    group = 'verification'
    workingDir 'playwright'
    commandLine 'npx', 'playwright', 'install'
    dependsOn 'playwrightInstall'
}

tasks.register('playwrightTest', Exec) {
    description = 'Run Playwright E2E tests'
    group = 'verification'
    workingDir 'playwright'
    commandLine 'npx', 'playwright', 'test'
    dependsOn 'playwrightBrowsers'
}

tasks.register('playwrightTestChromium', Exec) {
    description = 'Run Playwright E2E tests on Chromium only'
    group = 'verification'
    workingDir 'playwright'
    commandLine 'npx', 'playwright', 'test', '--project=chromium'
    dependsOn 'playwrightBrowsers'
}

tasks.register('playwrightReport', Exec) {
    description = 'Show Playwright test report'
    group = 'verification'
    workingDir 'playwright'
    commandLine 'npx', 'playwright', 'show-report'
}
