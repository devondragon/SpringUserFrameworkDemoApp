# Playwright Test Profile Configuration
# This profile enables the Test API controller for Playwright E2E tests
# IMPORTANT: This profile should NEVER be active in production

# Disable password reset emails - tests use Test API for token retrieval
app:
  mail:
    sendPasswordResetEmail: false

spring:
  datasource:
    # Use local development database - same as 'local' profile
    # Note: Credentials are hardcoded for test profile as this connects to a local development database only.
    # This profile is protected by @Profile annotation and should never be active in production.
    password: springuser
    url: jdbc:mariadb://localhost:3306/springuser?createDatabaseIfNotExist=true
    driverClassName: org.mariadb.jdbc.Driver
    username: springuser

# Enable test API endpoints by adding them to unprotected URIs
user:
  mfa:
    enabled: false
  registration:
    # Disable email sending since tests use Test API for token retrieval
    sendVerificationEmail: false
    googleEnabled: false
    facebookEnabled: false
  security:
    # E2E runs against http://localhost:8080; pin appUrl here so it wins over any ngrok appUrl a developer's
    # application-local.yml sets (this profile is typically activated as local,playwright-test).
    appUrl: http://localhost:8080
    # Allow the passkey-only "set initial password" flow to run without a StepUpService (SUF-02); the demo has no
    # StepUpService bean, so without this the flow returns HTTP 403.
    allowInitialPasswordSetWithoutStepUp: true
    # Test API endpoints are handled by TestApiSecurityConfig with IP whitelist restriction.
    # This replaces the base list wholesale rather than adding to it, so it has to repeat every entry from
    # application.yml. Keep it in sync with that list when either changes.
    unprotectedURIs: /,/index.html,/favicon.ico,/apple-touch-icon-precomposed.png,/css/*,/js/*,/js/user/*,/js/event/*,/js/utils/*,/img/**,/user/registration,/user/registration/passwordless,/user/resendRegistrationToken,/user/resetPassword,/user/registrationConfirm,/user/changePassword,/user/savePassword,/oauth2/authorization/*,/login,/user/login,/user/login.html,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/event/,/event/list.html,/event/**,/about.html,/error,/error.html,/webauthn/authenticate/**,/login/webauthn,/actuator/health

logging:
  level:
    com.digitalsanctuary.spring.demo.test.api: DEBUG
    com.digitalsanctuary.spring.demo.service: DEBUG
    com.digitalsanctuary.spring.user.service.UserEmailService: DEBUG
