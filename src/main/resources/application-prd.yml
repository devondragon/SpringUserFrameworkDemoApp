spring:
  thymeleaf:
    cache: true # Enable Thymeleaf cache in production
  jpa:
    show-sql: false # Disable SQL logging in production
    hibernate:
      ddl-auto: validate # Only validate schema in production, don't auto-update
  datasource:
    # Production datasource configuration (should be overridden by environment variables)
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/springuser_prod?createDatabaseIfNotExist=false}
    username: ${DATABASE_USERNAME:springuser}
    password: ${DATABASE_PASSWORD:springuser}

server:
  servlet:
    session:
      cookie:
        secure: true # Force secure cookies in production
        same-site: strict # Strict SameSite policy for production
        http-only: true

logging:
  level:
    root: WARN # Reduce log level in production
    com.digitalsanctuary: INFO
    org.springframework.security: WARN
  file:
    name: /opt/app/logs/user-app.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # Limit exposed actuator endpoints in production
  endpoint:
    health:
      show-details: never # Don't expose detailed health info in production

user:
  webauthn:
    rpId: ${WEBAUTHN_RP_ID:example.com}
    rpName: ${WEBAUTHN_RP_NAME:Spring User Framework Demo}
    allowedOrigins: ${WEBAUTHN_ALLOWED_ORIGINS:https://example.com}
  security:
    # Canonical base URL for security email links; driven by an env var in production so links can never derive
    # their authority from a spoofable Host header (SUF-01 / CWE-640).
    appUrl: ${APP_URL:https://example.com}
    # Fail startup unless a canonical appUrl (or trustedHosts) is configured - a hard guarantee for production.
    requireCanonicalAppUrl: true
    # NOTE: allowInitialPasswordSetWithoutStepUp is intentionally left at its secure default (false) here. In
    # production, setting an initial password on a passkey-only account should require step-up (a StepUpService bean),
    # not just an authenticated session (SUF-02).
    disableCSRFdURIs: # No CSRF disabled URIs in production for better security
    rememberMe:
      # No default on purpose: the demo signing key in application.yml must never reach production. Startup fails
      # unless REMEMBER_ME_KEY is provided.
      key: ${REMEMBER_ME_KEY}
      # Force the Secure flag unconditionally, mirroring the session cookie above. Spring's default falls back to
      # request.isSecure(), which is false behind a TLS-terminating proxy unless forwarded-header processing is
      # configured - without this a ~14-day login token could be sent over plain HTTP.
      useSecureCookie: true