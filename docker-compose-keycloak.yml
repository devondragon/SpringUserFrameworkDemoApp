services:
  myapp-db:
    image: mariadb:12.2
    container_name: springuser-db
    volumes:
      - userdb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springuser
      MYSQL_USER: springuser
      MYSQL_PASSWORD: springuser
      MYSQL_TCP_PORT: 3307
    ports:
      - "3307:3307"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: springuser-mail
    ports:
      # Web inbox. Open http://localhost:8025 to read the verification and password-reset mail the
      # app sends. SMTP (1025) is not published: only the app container needs to reach it.
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      # The app connects without auth (see SPRING_MAIL_* below). These two keep Mailpit accepting the
      # message if you point a client at it that insists on AUTH over a plaintext connection.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      # No curl in the image (Alpine + busybox, so wget/nc exist but curl doesn't). `mailpit readyz`
      # is what the image bakes into its own default HEALTHCHECK; this override just makes it explicit.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  myapp-main:
    image: spring-user-framework-demo
    container_name: springuser-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      myapp-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Not strictly required to boot, but the demo is useless until Keycloak answers, and this makes
      # `up` report the stack as ready only when a Keycloak login can actually be attempted.
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: keycloak.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://myapp-db:3307/springuser?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: springuser
      SPRING_PROFILES_ACTIVE: docker-keycloak
      # Mailpit captures everything the app sends and shows it at http://localhost:8025. It speaks
      # plain SMTP on 1025 with no auth and no STARTTLS, so verification and password-reset mail is
      # readable without any credentials. Registration verification is left at its base default of
      # true (application.yml:113): register, open the web inbox, click the link, log in.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak:
    container_name: keycloak.openid-provider
    image: quay.io/keycloak/keycloak:25.0.6
    command:
      - start
      - --verbose
      - --import-realm
    ports:
      - "8180:8080"
      - "8143:8443"
      - "9001:9000"
    volumes:
      - ./keycloak/ssl:/opt/keycloak/ssl/
      - ./keycloak/realm:/opt/keycloak/data/import/
    env_file: keycloak.env
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB_URL: jdbc:mariadb://myapp-db:3307/springuser
      KC_DB_USERNAME: springuser
      KC_DB_PASSWORD: springuser
    healthcheck:
      # The image has no curl or wget, so the probe is a one-file Java program.
      # It probes the realm's OIDC metadata rather than /health/live: Keycloak 25 serves health on the
      # management port only, and because KC_HTTPS_CERTIFICATE_FILE is set that port speaks HTTPS with
      # a self-signed certificate this probe cannot verify. The metadata document also proves the demo
      # realm finished importing, which /health/live does not.
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/realms/demo/.well-known/openid-configuration']
      interval: 5s
      timeout: 5s
      retries: 20
      # myapp-main gates on this probe, so a slow first start must not fail `up`. Failures inside the
      # start period do not count against retries: Liquibase schema creation plus the realm import
      # takes about 30s here and more on a cold or loaded machine.
      start_period: 60s
    depends_on:
      myapp-db:
        condition: service_healthy

volumes:
  userdb:
  keycloak:
